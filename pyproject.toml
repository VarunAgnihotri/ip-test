[project]
name = "ip-test"
version = "1.0.0"
description = "Tiny stdlib server figuring out what proxy is in front of it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Varun Agnihotri", email = "hello@pythonicvarun.me" }]

[project.scripts]
ip-server = "ip_server:main"

[project.urls]
Homepage = "https://github.com/VarunAgnihotri/ip-test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ip_server.py"]

[tool.ruff]
line-length = 100
